<svg xmlns="http://www.w3.org/2000/svg" width="800" height="482" viewBox="0 0 800 482" role="img" aria-label="D램 월 웨이퍼 생산능력은 삼성전자 66만 장, SK하이닉스 55만 장, CXMT 30만 장이다. 글로벌 D램 매출 점유율은 2025년 2분기 삼성전자 33퍼센트, SK하이닉스 39퍼센트, 마이크론 22퍼센트, CXMT 4퍼센트였으나 2026년 2분기에는 삼성전자 38퍼센트, SK하이닉스 25퍼센트, 마이크론 24퍼센트, CXMT 10퍼센트가 됐다. 한국 두 회사의 합은 72퍼센트에서 63퍼센트로 9퍼센트포인트 줄었고 CXMT는 4퍼센트에서 10퍼센트로 6퍼센트포인트 늘었다.">
